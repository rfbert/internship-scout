# Local development database (for your own machine).
# Usage: docker compose up -d   → then set DATABASE_URL in .env accordingly.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout_dev_pw
      POSTGRES_DB: internship_scout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d internship_scout"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
